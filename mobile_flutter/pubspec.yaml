name: glucosoft_app
description: Glucosoft App - Seguimiento privado de glucosa en Flutter con base de datos local SQLite, Bluetooth BLE y reportes PDF.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
